[tools]
python = "3.11"
node = "20"
pnpm = "9.15.9"
"conda:conda" = "latest"

[settings]
# The mise conda backend is still experimental. Keep the opt-in project-local
# so `mise install` can install conda without requiring a global user setting.
experimental = true

[env]
BANGERS_DATA_DIR = "{{config_root}}/backend/data"
BANGERS_MODEL_CACHE_DIR = "{{config_root}}/.cache/models"
ACESTEP_PROJECT_ROOT = "{{config_root}}/.cache/models"
HF_HOME = "{{config_root}}/.cache/models/huggingface"
HF_HUB_CACHE = "{{config_root}}/.cache/models/huggingface/hub"

[tasks.setup]
description = "Install local dependencies and create runtime/cache directories"
run = [
  "mkdir -p backend/data/audio backend/data/uploads",
  "mkdir -p .cache/models/checkpoints .cache/models/chat-llm .cache/models/huggingface/hub",
  "conda env create --yes --prefix backend/.conda --file backend/environment.yml || conda env update --prefix backend/.conda --file backend/environment.yml --prune",
  "cd backend && conda run --prefix .conda python -m pip install --prefer-binary --extra-index-url https://download.pytorch.org/whl/cu130 -e '.[dev]'",
  "pnpm --dir frontend install --frozen-lockfile",
]

[tasks.clean]
description = "Delete local runtime data and recreate a fresh data directory"
run = """
set -eu

data_dir="${BANGERS_DATA_DIR:-{{config_root}}/backend/data}"
config_root="{{config_root}}"
home_dir="${HOME:-}"

case "$data_dir" in
  ""|"/"|"$home_dir"|"$config_root"|".")
    echo "Refusing to clean unsafe BANGERS_DATA_DIR: $data_dir" >&2
    exit 1
    ;;
esac

echo "Removing runtime data: $data_dir"
rm -rf "$data_dir"
mkdir -p "$data_dir/audio" "$data_dir/uploads"
echo "Fresh data directory ready: $data_dir"
"""

[tasks.dev]
description = "Run the local backend and frontend without Docker"
run = "python -u start.py"

[tasks."trtllm:qwen3-8b-nvfp4"]
description = "Run TensorRT-LLM OpenAI server for Qwen3-8B-NVFP4 on port 8010"
run = """
sudo docker run --rm \
  --name bangers-trtllm-qwen3-8b-nvfp4 \
  --gpus all \
  --ipc=host \
  -p 8010:8010 \
  -v "{{config_root}}/.cache/models/chat-llm/Qwen3-8B-NVFP4:/models/Qwen3-8B-NVFP4:ro" \
  -w /models \
  nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc1 \
  trtllm-serve serve Qwen3-8B-NVFP4 \
    --host 0.0.0.0 \
    --port 8010 \
    --tp_size 1
"""

[tasks."trtllm:qwen3-14b-nvfp4"]
description = "Run TensorRT-LLM OpenAI server for Qwen3-14B-NVFP4 on port 8010"
run = """
sudo docker run --rm \
  --name bangers-trtllm-qwen3-14b-nvfp4 \
  --gpus all \
  --ipc=host \
  -p 8010:8010 \
  -v "{{config_root}}/.cache/models/chat-llm/Qwen3-14B-NVFP4:/models/Qwen3-14B-NVFP4:ro" \
  -w /models \
  nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc1 \
  trtllm-serve serve Qwen3-14B-NVFP4 \
    --host 0.0.0.0 \
    --port 8010 \
    --tp_size 1
"""

[tasks."trtllm:qwen3-30b-fp4"]
description = "Run TensorRT-LLM OpenAI server for Qwen3-30B-FP4 on port 8010"
run = """
sudo docker run --rm \
  --name bangers-trtllm-qwen3-30b-fp4 \
  --gpus all \
  --ipc=host \
  -p 8010:8010 \
  -v "{{config_root}}/.cache/models/chat-llm/Qwen3-30B-FP4:/models/Qwen3-30B-FP4:ro" \
  -w /models \
  nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc1 \
  trtllm-serve serve Qwen3-30B-FP4 \
    --host 0.0.0.0 \
    --port 8010 \
    --tp_size 1
"""

[tasks."dev:with-trt"]
description = "Run the app against an externally managed TRT-LLM server on port 8010"
run = "BANGERS_TRTLLM_MANAGED=false BANGERS_TRTLLM_SERVER_URL=http://127.0.0.1:8010 BANGERS_TRTLLM_TIMEOUT_SECONDS=120 python -u start.py"

[tasks.test]
description = "Run backend and frontend tests once"
run = [
  "cd backend && conda run --prefix .conda pytest -v",
  "pnpm --dir frontend exec vitest --run",
]
